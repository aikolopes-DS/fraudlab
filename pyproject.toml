[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudlab"
version = "0.1.0"
description = "Reproducible fraud classification experiments for Kaggle S6E11"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "catboost>=1.2,<2",
    "lightgbm>=4.7,<5",
]

[project.optional-dependencies]
neural = ["torch>=2.2,<3"]
dev = ["pytest>=8,<10"]
presentation = ["Pillow>=10,<13", "matplotlib>=3.8,<4", "edge-tts>=7.3,<8"]
review = ["faster-whisper>=1.2,<2"]

[project.scripts]
fraudlab = "fraudlab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
