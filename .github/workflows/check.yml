name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies and CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,presentation]"

      - name: Test contracts and synthetic experiments
        run: python -m pytest tests presentation/test_presentation.py site/test_build.py -q

      - name: Validate the public site
        run: |
          node --check site/app.js
          python site/build.py
